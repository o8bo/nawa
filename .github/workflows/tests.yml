name: Tests
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 xvfb
      - name: Test storage, preferences and native interface
        run: xvfb-run -a /usr/bin/python3 -m unittest discover -p 'test_*.py' -v
